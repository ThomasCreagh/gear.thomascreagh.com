<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gear — Browse</title>
  <link rel="stylesheet" href="static/style.css">
  <style>
    .category-section { margin-bottom:2rem; }
    .category-header {
      display:flex; align-items:center; gap:0.75rem;
      cursor:pointer; user-select:none;
      padding:0.6rem 0; border-bottom:2px solid var(--border);
      margin-bottom:0.75rem;
    }
    .category-header h2 { font-size:1rem; color:var(--primary); margin:0; flex:1; }
    .category-header .toggle-icon { color:var(--muted); font-size:0.8rem; transition:transform 0.2s; }
    .category-header.collapsed .toggle-icon { transform:rotate(-90deg); }
    .category-body.hidden { display:none; }
    .search-bar { display:flex; align-items:center; gap:0.75rem; margin-bottom:1.25rem; }
    .search-bar input { margin:0; flex:1; }
    .search-bar .clear-btn { background:none; border:none; cursor:pointer; color:var(--muted); font-size:1.1rem; line-height:1; padding:0 0.25rem; }
    .search-bar .clear-btn:hover { color:var(--text); }
    .no-results { color:var(--muted); font-size:0.9rem; padding:0.5rem 0; }
    .info-banner {
      background:#e8f4fd; border:1px solid #bee3f8; border-radius:var(--radius);
      padding:0.9rem 1.2rem; margin-bottom:1.25rem;
      display:flex; align-items:center; justify-content:space-between; gap:1rem;
    }
    .info-banner span { color:#2b6cb0; font-size:0.9rem; }
    .info-banner a { color:#2b6cb0; font-weight:700; white-space:nowrap; }
  </style>
</head>
<body>
<nav>
  <span class="logo">⛺ Gear</span>
  <div>
    <a href="gear.html" style="font-weight:700">Browse</a>
    <a href="myloans.html">My Loans</a>
    <a href="about.html">How It Works</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</nav>

<div class="container">
  <h1>Available Gear</h1>

  <div class="alert alert-error" id="error"></div>

  <div class="card" id="not-approved" style="display:none;background:#fff3cd;border:1px solid #f39c12">
    <h2>⏳ Account Pending Approval</h2>
    <p>Your account is waiting for Tom to approve it. You'll receive an email once approved.</p>
  </div>

  <div id="main" style="display:none">

    <div class="info-banner">
      <span>📍 To borrow gear, head to the lockers and start a loan from <strong>My Loans</strong>.</span>
      <a href="myloans.html">Go to My Loans →</a>
    </div>

    <div class="search-bar">
      <input type="text" id="gear-search" placeholder="Search by name, tag, category…"
        oninput="filterGear()" style="margin-bottom:0">
      <button class="clear-btn" id="search-clear" onclick="clearSearch()" title="Clear" style="display:none">✕</button>
    </div>

    <div id="categories-container"></div>
  </div>
</div>

<script src="static/api.js"></script>
<script>
  requireAuth();
  let items = [];

  const CATEGORY_LABELS = {
    harness:"Harness", pad:"Pad", rope:"Rope", cam:"Cam",
    quickdraw:"Quickdraw", nut:"Nut", carabiner:"Carabiner",
    helmet:"Helmet", belay_device:"Belay Device", sling:"Sling",
    rope_protector:"Rope Protector", misc_trad:"Misc Trad", misc:"Misc"
  };
  const CATEGORY_ORDER = ["harness","pad","rope","cam","quickdraw","nut","carabiner","helmet","belay_device","sling","rope_protector","misc_trad","misc"];
  const LOCKER_LABELS  = { outdoor:"Outdoor Locker", top:"Top Locker", bottom:"Bottom Locker", pad:"Pad Stash" };

  async function init() {
    try {
      const me = await getMe();
      if (!me.is_approved) { document.getElementById("not-approved").style.display = "block"; return; }
      if (me.is_locked) showError(document.getElementById("error"), "⚠️ Your account is locked due to overdue items. Contact Tom.");
      document.getElementById("main").style.display = "block";
      items = await apiFetch("/items");
      renderCategories();
    } catch (e) { showError(document.getElementById("error"), e.message); }
  }

  function renderCategories() {
    const container = document.getElementById("categories-container");
    const groups = {};
    for (const item of items) {
      const cat = item.category || "misc";
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(item);
    }
    for (const cat of Object.keys(groups)) {
      groups[cat].sort((a, b) => (a.tag || "").localeCompare(b.tag || "", undefined, { numeric: true }));
    }
    const orderedCats = [...CATEGORY_ORDER.filter(c => groups[c]), ...Object.keys(groups).filter(c => !CATEGORY_ORDER.includes(c))];

    container.innerHTML = orderedCats.map(cat => {
      const catItems = groups[cat];
      const availableCount = catItems.filter(i => i.available).length;
      const label = CATEGORY_LABELS[cat] || cat;
      return `
        <div class="category-section">
          <div class="category-header" onclick="toggleCategory(this)">
            <h2>${label}</h2>
            <span class="badge ${availableCount > 0 ? 'badge-green' : 'badge-gray'}">${availableCount}/${catItems.length} available</span>
            <span class="toggle-icon">▾</span>
          </div>
          <div class="category-body">
            <div class="grid">
              ${catItems.map(item => `
                <div class="item-card">
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <h3>${item.name}</h3>
                    <span class="badge ${item.available ? 'badge-green' : 'badge-red'}">${item.available ? 'Available' : 'Out'}</span>
                  </div>
                  <div style="margin:0.35rem 0">
                    <span class="badge" style="background:#eef2ff;color:#4338ca;font-weight:700">📍 ${LOCKER_LABELS[item.locker] || 'Locker not set'}</span>
                  </div>
                  <p>${item.description || ''}</p>
                  <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.25rem">
                    ${item.tag    ? `<span class="badge badge-gray">Tag #${item.tag}</span>` : ''}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>`;
    }).join("");
  }

  function toggleCategory(header) {
    header.classList.toggle("collapsed");
    header.nextElementSibling.classList.toggle("hidden");
  }

  function filterGear() {
    const q = document.getElementById("gear-search").value.trim().toLowerCase();
    document.getElementById("search-clear").style.display = q ? "inline" : "none";

    let anyVisible = false;
    document.querySelectorAll(".category-section").forEach(section => {
      let sectionHasMatch = false;
      section.querySelectorAll(".item-card").forEach(card => {
        const show = !q || card.textContent.toLowerCase().includes(q);
        card.style.display = show ? "" : "none";
        if (show) sectionHasMatch = true;
      });
      section.style.display = sectionHasMatch ? "" : "none";
      if (sectionHasMatch) {
        anyVisible = true;
        if (q) {
          section.querySelector(".category-header").classList.remove("collapsed");
          section.querySelector(".category-body").classList.remove("hidden");
        }
      }
    });

    let noResults = document.getElementById("no-results-msg");
    if (!noResults) {
      noResults = document.createElement("p");
      noResults.id = "no-results-msg";
      noResults.className = "no-results";
      noResults.textContent = "No items match your search.";
      document.getElementById("categories-container").after(noResults);
    }
    noResults.style.display = (q && !anyVisible) ? "block" : "none";
  }

  function clearSearch() {
    document.getElementById("gear-search").value = "";
    filterGear();
  }

  init();
</script>
</body>
</html>
