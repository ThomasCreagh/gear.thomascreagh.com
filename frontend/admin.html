<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gear — Admin</title>
  <link rel="stylesheet" href="static/style.css">
  <style>
    .toggle { display:inline-flex; align-items:center; gap:0.4rem; font-size:0.8rem; cursor:pointer; }
    .toggle input { width:auto; margin:0; cursor:pointer; }
    .photo-grid { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.5rem; }
    .photo-thumb { position:relative; }
    .photo-thumb img { width:80px; height:80px; object-fit:cover; border-radius:4px; border:2px solid var(--border); cursor:pointer; }
    .photo-thumb span { display:block; font-size:0.65rem; text-align:center; color:var(--muted); }
    .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; align-items:center; justify-content:center; flex-direction:column; gap:1rem; }
    .lightbox.open { display:flex; }
    .lightbox img { max-width:90vw; max-height:80vh; border-radius:var(--radius); }
    .lightbox button { color:white; background:rgba(255,255,255,0.2); border:none; padding:0.5rem 1.2rem; border-radius:var(--radius); cursor:pointer; font-size:1rem; }
    .expandable { display:none; }
    .expandable.open { display:table-row; }
    .expand-row td { background:var(--bg); padding:1rem; }
    .pending-badge { background:#fff3cd; color:#856404; }
  </style>
</head>
<body>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="Photo">
  <button onclick="closeLightbox()">✕ Close</button>
</div>

<nav>
  <span class="logo">⛺ Gear Admin</span>
  <div>
    <a href="gear.html">Browse</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</nav>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="showTab('users', this)">Users</button>
    <button class="tab" onclick="showTab('items', this)">Gear</button>
    <button class="tab" onclick="showTab('loans', this)">Loans <span id="pending-count" class="badge badge-yellow" style="display:none"></span></button>
    <button class="tab" onclick="showTab('stock', this)">Stock Check</button>
    <button class="tab" onclick="showTab('locker', this)">Locker Codes</button>
    <button class="tab" onclick="showTab('audit', this)">Audit Log</button>
  </div>

  <div class="alert alert-error" id="error"></div>
  <div class="alert alert-success" id="success"></div>

  <!-- USERS -->
  <div class="section active" id="tab-users">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <h1>Users</h1>
      <button class="btn btn-primary" onclick="toggleForm('create-user-form')">+ Create User</button>
    </div>
    <div class="card" id="create-user-form" style="display:none;margin-bottom:1rem">
      <h2>Create User</h2>
      <label>Email</label>
      <input type="email" id="new-email" placeholder="user@tcd.ie">
      <button type="button" class="btn btn-primary" onclick="createUser()">Create & Send Credentials</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Email</th><th>Approved</th><th>Auto-approve</th><th>Locked</th><th>Actions</th></tr></thead>
        <tbody id="users-table"></tbody>
      </table>
    </div>
  </div>

  <!-- ITEMS -->
  <div class="section" id="tab-items">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <h1>Gear Items</h1>
      <button class="btn btn-primary" onclick="toggleForm('create-item-form')">+ Add Item</button>
    </div>
    <div class="card" id="create-item-form" style="display:none;margin-bottom:1rem">
      <h2>Add Item</h2>
      <label>Name</label><input type="text" id="new-item-name" placeholder="Tent, Sleeping Bag...">
      <label>Description</label><input type="text" id="new-item-desc" placeholder="Optional">
      <label>Tag #</label><input type="number" id="new-item-tag" placeholder="e.g. 42" style="width:120px">
      <label>Locker</label>
      <select id="new-item-locker">
        <option value="">-- Select --</option>
        <option value="outdoor">Outdoor Locker</option>
        <option value="top">Top Locker</option>
        <option value="bottom">Bottom Locker</option>
        <option value="pad">Pad Stash</option>
      </select>
      <button type="button" class="btn btn-primary" onclick="createItem()">Add</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Tag</th><th>Name</th><th>Locker</th><th>Available</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="items-table"></tbody>
      </table>
    </div>
  </div>

  <!-- LOANS -->
  <div class="section" id="tab-loans">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <h1>Loans</h1>
      <div style="display:flex;gap:0.5rem">
        <button type="button" class="btn btn-secondary" onclick="checkOverdue()">Check Overdue</button>
        <label class="toggle"><input type="checkbox" id="active-only" onchange="loadLoans()"> Active only</label>
      </div>
    </div>
    <div class="card">
      <table id="loans-table-wrap">
        <thead><tr><th>User</th><th>Items</th><th>Lockers</th><th>Due</th><th>Status</th><th>Photos</th><th></th></tr></thead>
        <tbody id="loans-table"></tbody>
      </table>
    </div>
  </div>

  <!-- STOCK CHECK -->
  <div class="section" id="tab-stock">
    <h1>Weekly Stock Check</h1>
    <div class="card">
      <div id="stock-list"></div>
      <button type="button" class="btn btn-primary" onclick="submitStock()" style="margin-top:1rem">Submit Stock Check</button>
    </div>
  </div>

  <!-- LOCKER CODES -->
  <div class="section" id="tab-locker">
    <h1>Locker Codes</h1>
    <div class="stat-grid" id="locker-codes-grid"></div>
    <div class="card" style="margin-top:1rem">
      <h2>Update a Code</h2>
      <label>Locker</label>
      <select id="new-code-locker" style="width:220px">
        <option value="outdoor">Outdoor Locker</option>
        <option value="top">Top Locker</option>
        <option value="bottom">Bottom Locker</option>
        <option value="pad">Pad Stash</option>
      </select>
      <label>New Code</label>
      <input type="text" id="new-code" placeholder="e.g. 4821" style="width:200px">
      <button type="button" class="btn btn-primary" onclick="updateLockerCode()">Update Code</button>
    </div>
  </div>

  <!-- AUDIT LOG -->
  <div class="section" id="tab-audit">
    <h1>Audit Log</h1>
    <div class="card">
      <table>
        <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
        <tbody id="audit-table"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="static/api.js"></script>
<script>
  const LOCKER_LABELS = { outdoor: "Outdoor Locker", top: "Top Locker", bottom: "Bottom Locker", pad: "Pad Stash" };
  let allUsers = [], allItems = [], allLoans = [];

  async function init() {
    await requireAdmin();
    await Promise.all([loadUsers(), loadItems(), loadLoans()]);
    loadLockerCodes();
    loadAudit();
  }

  function showTab(name, el) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.getElementById(`tab-${name}`).classList.add("active");
    el.classList.add("active");
    if (name === "stock") buildStockList();
  }

  function toggleForm(id) {
    const f = document.getElementById(id);
    f.style.display = f.style.display === "none" ? "block" : "none";
  }

  function msg(text, isError) {
    const el = document.getElementById(isError ? "error" : "success");
    el.textContent = text; el.style.display = "block";
    setTimeout(() => el.style.display = "none", 4000);
  }

  // --- USERS ---
  async function loadUsers() {
    allUsers = await apiFetch("/admin/users");
    document.getElementById("users-table").innerHTML = allUsers.map(u => `
      <tr>
        <td>${u.email}</td>
        <td><span class="badge ${u.is_approved ? 'badge-green' : 'badge-yellow'}">${u.is_approved ? 'Yes' : 'Pending'}</span></td>
        <td><span class="badge ${u.auto_approve ? 'badge-green' : 'badge-gray'}">${u.auto_approve ? 'Auto' : 'Manual'}</span></td>
        <td><span class="badge ${u.is_locked ? 'badge-red' : 'badge-gray'}">${u.is_locked ? 'Locked' : 'OK'}</span></td>
        <td style="display:flex;gap:0.4rem;flex-wrap:wrap">
          ${!u.is_approved ? `<button class="btn btn-sm btn-success" onclick="approveUser(${u.id})">Approve</button>` : ''}
          <button class="btn btn-sm ${u.auto_approve ? 'btn-secondary' : 'btn-primary'}" onclick="toggleAutoApprove(${u.id})">${u.auto_approve ? 'Set Manual' : 'Set Auto'}</button>
          <button class="btn btn-sm ${u.is_locked ? 'btn-success' : 'btn-danger'}" onclick="toggleLock(${u.id})">${u.is_locked ? 'Unlock' : 'Lock'}</button>
          <button class="btn btn-sm btn-secondary" onclick="resetPw(${u.id})">Reset PW</button>
        </td>
      </tr>
    `).join("");
  }

  async function createUser() {
    const email = document.getElementById("new-email").value.trim();
    if (!email) return;
    try {
      await apiFetch(`/admin/users?email=${encodeURIComponent(email)}`, { method: "POST" });
      msg(`✓ User created, credentials sent to ${email}`);
      toggleForm("create-user-form");
      await loadUsers();
    } catch (e) { msg(e.message, true); }
  }

  async function approveUser(id) { await apiFetch(`/admin/users/${id}/approve`, { method: "POST" }); await loadUsers(); }
  async function toggleLock(id) { await apiFetch(`/admin/users/${id}/lock`, { method: "POST" }); await loadUsers(); }
  async function toggleAutoApprove(id) { await apiFetch(`/admin/users/${id}/auto-approve`, { method: "POST" }); await loadUsers(); }
  async function resetPw(id) {
    if (!confirm("Reset password and send email?")) return;
    await apiFetch(`/admin/users/${id}/reset-password`, { method: "POST" });
    msg("✓ Password reset, email sent.");
  }

  // --- ITEMS ---
  async function loadItems() {
    allItems = await apiFetch("/items/all");
    document.getElementById("items-table").innerHTML = allItems.map(i => `
      <tr style="${i.retired ? 'opacity:0.5' : ''}">
        <td><span class="badge badge-gray">#${i.tag ?? '—'}</span></td>
        <td>${i.name}</td>
        <td>${i.locker ? `<span class="badge badge-gray">${LOCKER_LABELS[i.locker] || i.locker}</span>` : '—'}</td>
        <td><span class="badge ${i.available ? 'badge-green' : 'badge-red'}">${i.available ? 'Yes' : 'No'}</span></td>
        <td>${i.retired ? '<span class="badge badge-red">Retired</span>' : '<span class="badge badge-green">Active</span>'}</td>
        <td style="display:flex;gap:0.4rem;flex-wrap:wrap">
          ${!i.retired ? `<button class="btn btn-sm btn-secondary" onclick="toggleItem(${i.id}, ${!i.available})">${i.available ? 'Mark Out' : 'Mark In'}</button>` : ''}
          <button class="btn btn-sm ${i.retired ? 'btn-success' : 'btn-danger'}" onclick="toggleRetire(${i.id}, ${i.retired})">${i.retired ? 'Restore' : 'Retire'}</button>
          <button class="btn btn-sm btn-danger" onclick="deleteItem(${i.id})">Delete</button>
        </td>
      </tr>
    `).join("");
  }

  async function createItem() {
    const name = document.getElementById("new-item-name").value.trim();
    const description = document.getElementById("new-item-desc").value.trim();
    const tag = parseInt(document.getElementById("new-item-tag").value) || null;
    const locker = document.getElementById("new-item-locker").value || null;
    if (!name) return;
    try {
      await apiFetch("/items", { method: "POST", body: JSON.stringify({ name, description, tag, locker }) });
      msg("✓ Item added."); toggleForm("create-item-form"); await loadItems();
    } catch (e) { msg(e.message, true); }
  }

  async function toggleItem(id, available) { await apiFetch(`/items/${id}`, { method: "PUT", body: JSON.stringify({ available }) }); await loadItems(); }
  async function toggleRetire(id, currentlyRetired) {
    if (!currentlyRetired && !confirm("Retire this item? Users will no longer be able to borrow it.")) return;
    await apiFetch(`/items/${id}`, { method: "PUT", body: JSON.stringify({ retired: !currentlyRetired }) });
    await loadItems();
  }
  async function deleteItem(id) {
    if (!confirm("Permanently delete this item?")) return;
    await apiFetch(`/items/${id}`, { method: "DELETE" }); await loadItems();
  }

  // --- LOANS ---
  async function loadLoans() {
    const activeOnly = document.getElementById("active-only").checked;
    allLoans = await apiFetch(`/admin/loans${activeOnly ? '?active_only=true' : ''}`);
    const pending = allLoans.filter(l => l.status === "pending");
    const countEl = document.getElementById("pending-count");
    if (pending.length) { countEl.textContent = pending.length; countEl.style.display = "inline"; }
    else countEl.style.display = "none";

    document.getElementById("loans-table").innerHTML = allLoans.map(loan => {
      const due = loan.due_date ? new Date(loan.due_date).toLocaleDateString() : "—";
      const overdue = loan.due_date && loan.status === "active" && new Date(loan.due_date) < new Date();
      const lockerStr = (loan.lockers || []).map(l => LOCKER_LABELS[l] || l).join(", ");
      const borrowCount = loan.photos.filter(p => p.photo_type === "borrow").length;
      const returnCount = loan.photos.filter(p => p.photo_type === "return").length;
      const totalLockers = (loan.lockers || []).length;

      const statusBadge = {
        pending: '<span class="badge pending-badge">Pending</span>',
        active: overdue ? '<span class="badge badge-red">Overdue</span>' : '<span class="badge badge-green">Active</span>',
        returned: '<span class="badge badge-gray">Returned</span>',
        denied: '<span class="badge badge-red">Denied</span>',
      }[loan.status] || loan.status;

      return `
        <tr>
          <td style="font-size:0.85rem">${loan.user_email}</td>
          <td style="font-size:0.85rem">${loan.item_names.join(", ")}</td>
          <td style="font-size:0.8rem">${lockerStr || '—'}</td>
          <td style="font-size:0.85rem">${due}</td>
          <td>${statusBadge}</td>
          <td style="font-size:0.8rem">
            📷 ${borrowCount}/${totalLockers} borrow<br>
            📷 ${returnCount}/${totalLockers} return
          </td>
          <td>
            <button class="btn btn-sm btn-secondary" onclick="toggleExpand(${loan.id})">▼</button>
            ${loan.status === 'pending' ? `
              <button class="btn btn-sm btn-success" onclick="approveLoan(${loan.id})">Approve</button>
              <button class="btn btn-sm btn-danger" onclick="denyLoan(${loan.id})">Deny</button>
            ` : ''}
          </td>
        </tr>
        <tr class="expandable" id="expand-${loan.id}">
          <td colspan="7">
            <div style="display:flex;gap:2rem;flex-wrap:wrap">
              ${["borrow","return"].map(type => {
                const photos = loan.photos.filter(p => p.photo_type === type);
                return `<div>
                  <strong style="text-transform:capitalize">${type} photos:</strong>
                  ${photos.length ? `<div class="photo-grid">${photos.map(p => `
                    <div class="photo-thumb">
                      <img src="/${p.file_path}" onclick="openLightbox('/${p.file_path}')" title="${LOCKER_LABELS[p.locker] || p.locker}">
                      <span>${LOCKER_LABELS[p.locker] || p.locker}</span>
                    </div>`).join("")}</div>`
                  : `<span style="color:var(--muted);font-size:0.85rem"> None yet</span>`}
                </div>`;
              }).join("")}
            </div>
          </td>
        </tr>`;
    }).join("");
  }

  function toggleExpand(id) {
    const row = document.getElementById(`expand-${id}`);
    row.classList.toggle("open");
  }

  async function approveLoan(id) {
    try { await apiFetch(`/loans/${id}/approve`, { method: "POST" }); msg("✓ Loan approved, email sent."); await loadLoans(); }
    catch (e) { msg(e.message, true); }
  }
  async function denyLoan(id) {
    if (!confirm("Deny this borrow request?")) return;
    await apiFetch(`/loans/${id}/deny`, { method: "POST" }); msg("Loan denied."); await loadLoans();
  }
  async function checkOverdue() {
    const result = await apiFetch("/admin/check-overdue", { method: "POST" });
    msg(result.locked_users.length ? `⚠️ Locked: ${result.locked_users.join(", ")}` : "✓ No overdue loans.");
    await loadUsers();
  }

  // --- LIGHTBOX ---
  function openLightbox(src) {
    document.getElementById("lightbox-img").src = src;
    document.getElementById("lightbox").classList.add("open");
  }
  function closeLightbox() { document.getElementById("lightbox").classList.remove("open"); }

  // --- STOCK CHECK ---
  function buildStockList() {
    const activeItems = allItems.filter(i => !i.retired);
    document.getElementById("stock-list").innerHTML = activeItems.map(item => `
      <div style="display:flex;align-items:center;gap:1rem;padding:0.5rem 0;border-bottom:1px solid var(--border)">
        <span class="badge badge-gray">#${item.tag ?? '—'}</span>
        <label style="flex:1;font-weight:600">${item.name}</label>
        <span class="badge ${item.available ? 'badge-green' : 'badge-red'}" style="min-width:80px">Expected: ${item.available ? 'In' : 'Out'}</span>
        <label><input type="checkbox" id="stock-${item.id}" ${item.available ? 'checked' : ''}> Present</label>
        <input type="text" placeholder="Notes" id="notes-${item.id}" style="width:140px;margin:0">
      </div>
    `).join("");
  }

  async function submitStock() {
    const activeItems = allItems.filter(i => !i.retired);
    const items = activeItems.map(item => ({
      item_id: item.id,
      present: document.getElementById(`stock-${item.id}`).checked,
      notes: document.getElementById(`notes-${item.id}`).value
    }));
    try {
      const result = await apiFetch("/admin/stock-check", { method: "POST", body: JSON.stringify({ items }) });
      msg(`✓ Stock check done. ${result.discrepancies.length} discrepancy(s).${result.discrepancies.length ? ' Issues: ' + result.discrepancies.map(d => d.name).join(", ") : ''}`);
    } catch (e) { msg(e.message, true); }
  }

  // --- LOCKER CODES ---
  async function loadLockerCodes() {
    const data = await apiFetch("/admin/locker-code");
    document.getElementById("locker-codes-grid").innerHTML = Object.entries(data).map(([locker, info]) => `
      <div class="stat-card">
        <div class="label">${LOCKER_LABELS[locker] || locker}</div>
        <div class="num" style="font-size:1.6rem;letter-spacing:0.15em">${info.code || '—'}</div>
        <div class="label">${info.updated_at ? new Date(info.updated_at).toLocaleDateString() : 'Not set'}</div>
      </div>
    `).join("");
  }

  async function updateLockerCode() {
    const locker = document.getElementById("new-code-locker").value;
    const code = document.getElementById("new-code").value.trim();
    if (!code) return msg("Enter a code.", true);
    try {
      await apiFetch("/admin/locker-code", { method: "POST", body: JSON.stringify({ locker, code }) });
      msg(`✓ ${LOCKER_LABELS[locker]} code updated.`);
      loadLockerCodes();
    } catch (e) { msg(e.message, true); }
  }

  // --- AUDIT LOG ---
  async function loadAudit() {
    const logs = await apiFetch("/admin/audit-log");
    document.getElementById("audit-table").innerHTML = logs.map(l => `
      <tr>
        <td style="white-space:nowrap;font-size:0.8rem">${new Date(l.timestamp).toLocaleString()}</td>
        <td style="font-size:0.8rem">${allUsers.find(u => u.id === l.user_id)?.email || l.user_id}</td>
        <td><code style="font-size:0.8rem">${l.action}</code></td>
        <td style="font-size:0.8rem;color:var(--muted)">${l.details || ''}</td>
      </tr>
    `).join("");
  }

  init();
</script>
</body>
</html>
